schema_version: 2
experiment:
  id: reproduction_dressrecon_bob_recompute
  target_id: reproduction_dressrecon_bob_recompute
  title: Historical DressRecon BoB 20k-point diagnostic
  paper_target: Diagnostic reconstruction of the recovered table-era BoB path
  seed: 42
output_dir: ../runs/reproduction_dressrecon_bob_recompute
datasets:
  - id: dna_rendering
    label: DNA-Rendering
    cases:
      - dna_0012_11
      - dna_0013_01
      - dna_0013_03
      - dna_0013_09
      - dna_0013_11
      - dna_0019_08
      - dna_0021_03
      - dna_0023_06
  - id: actorshq
    label: ActorsHQ
    cases:
      - actorshq_actor01_seq1
      - actorshq_actor01_seq2
      - actorshq_actor02_seq1
      - actorshq_actor02_seq2
      - actorshq_actor04_seq2
      - actorshq_actor05_seq1
      - actorshq_actor06_seq1
      - actorshq_actor06_seq2
      - actorshq_actor07_seq1
      - actorshq_actor08_seq1
methods:
  - id: smpl_bob_historical_20k
    label: SMPL + DressRecon BoB (historical 20k diagnostic)
    classification: diagnostic_not_strict_reproduction
    mode: external
    stages:
      - id: preflight
        type: command
        cwd: "{config_dir}/../.."
        command:
          - ${GA_D3DGS_PYTHON:-~/anaconda3/envs/dynamic_gaussians/bin/python}
          - -m
          - experiments.reproductions.dressrecon_bob.availability
          - --case
          - "{case.id}"
          - --dna-results-dir
          - ${GA_D3DGS_DNA_RESULTS:-~/research/GA/Dynamic3DGaussians/server_output/dna_exp_1x}
          - --actorshq-results-dir
          - ${GA_D3DGS_ACTORSHQ_RESULTS:-~/research/GA/Dynamic3DGaussians/output/actorshq_exp_iso}
          - --annotations-dir
          - ${GA_DNA_ANNOTATIONS:-~/research/data/DNA-Rendering/data_used_in_4K4D/annotations}
          - --actorshq-smplx-dir
          - ${GA_ACTORSHQ_SMPLX:-~/research/GA/Dynamic3DGaussians/actorshq_smplx}
          - --data-dir
          - ${GA_D3DGS_DATA:-~/research/GA/Dynamic3DGaussians/data}
          - --output
          - "{run_dir}/availability.json"
          - --include-paths
          - --require-fit-ready
        outputs: ["{run_dir}/availability.json"]
      - id: fit
        type: command
        cwd: ${GA_D3DGS_ROOT:-~/research/GA/Dynamic3DGaussians}
        env:
          PYTHONPATH: "{config_dir}/../..:${GA_DRESSRECON_ROOT:-~/research/code/dressrecon}:${PYTHONPATH:-}"
        command:
          - ${GA_D3DGS_PYTHON:-~/anaconda3/envs/dynamic_gaussians/bin/python}
          - -m
          - experiments.reproductions.dressrecon_bob.batch_fit
          - --gpu
          - 0
          - --sequences
          - "{case.id}"
          - --train_ratio
          - 0.8
          - --num_iters
          - 2000
          - --num_bones
          - 25
          - --max_points
          - 20000
          - --output_root
          - "{run_dir}/bob"
          - --dna_results_dir
          - ${GA_D3DGS_DNA_RESULTS:-~/research/GA/Dynamic3DGaussians/server_output/dna_exp_1x}
          - --actorshq_results_dir
          - ${GA_D3DGS_ACTORSHQ_RESULTS:-~/research/GA/Dynamic3DGaussians/output/actorshq_exp_iso}
          - --annotations_dir
          - ${GA_DNA_ANNOTATIONS:-~/research/data/DNA-Rendering/data_used_in_4K4D/annotations}
          - --actorshq_smplx_dir
          - ${GA_ACTORSHQ_SMPLX:-~/research/GA/Dynamic3DGaussians/actorshq_smplx}
        outputs:
          - "{run_dir}/bob/{case.id}/metadata.json"
          - "{run_dir}/bob/{case.id}/warped_sequence.npy"
      - id: evaluate
        type: command
        cwd: ${GA_D3DGS_ROOT:-~/research/GA/Dynamic3DGaussians}
        env:
          PYTHONPATH: "{config_dir}/../..:${PYTHONPATH:-}"
        command:
          - ${GA_D3DGS_PYTHON:-~/anaconda3/envs/dynamic_gaussians/bin/python}
          - -m
          - experiments.reproductions.dressrecon_bob.evaluate
          - --gpu
          - 0
          - --sequences
          - "{case.id}"
          - --bob_root
          - "{run_dir}/bob"
          - --dna_results_dir
          - ${GA_D3DGS_DNA_RESULTS:-~/research/GA/Dynamic3DGaussians/server_output/dna_exp_1x}
          - --actorshq_results_dir
          - ${GA_D3DGS_ACTORSHQ_RESULTS:-~/research/GA/Dynamic3DGaussians/output/actorshq_exp_iso}
          - --data_dir
          - ${GA_D3DGS_DATA:-~/research/GA/Dynamic3DGaussians/data}
          - --output_dir
          - "{run_dir}/evaluation"
        inputs:
          - "{run_dir}/bob/{case.id}/metadata.json"
          - "{run_dir}/bob/{case.id}/warped_sequence.npy"
        outputs: ["{run_dir}/evaluation/{case.id}.json"]
      - id: collect
        type: collect_json
        source: "{run_dir}/evaluation/{case.id}.json"
        selectors:
          psnr: bob.psnr
          ssim: bob.ssim
          lpips: bob.lpips
          fg_psnr: bob.fg_psnr
        output: "{run_dir}/image_metrics.json"
        inputs: ["{run_dir}/evaluation/{case.id}.json"]
        outputs: ["{run_dir}/image_metrics.json"]
