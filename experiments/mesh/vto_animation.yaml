schema_version: 2
experiment:
  id: vto_animation
  target_id: vto_garment_animation
  title: VTO unseen-pose garment animation
  paper_target: "Table 4 / VTO garment mean vertex error"
  seed: 42
output_dir: ../runs/vto_animation
datasets:
  - id: vto
    label: VTO (109 motion sequences, 13,979 cloth meshes)
    protocol: first five sorted shape00 motions for training; frozen held-out targets
    metric: mean per-frame per-vertex Euclidean distance in millimeters
    metric_note: The paper labels this value RMSE, but the recovered evaluator averages Euclidean vertex distances without a final root-mean-square reduction.
    cases:
      - id: tshirt
        exclude: tshirt_shape00_104_17
        training_cases: tshirt_shape00_01_01,tshirt_shape00_02_04,tshirt_shape00_02_05,tshirt_shape00_05_20,tshirt_shape00_07_02
        expected_cases: tshirt_shape00_91_33,tshirt_shape00_91_36,tshirt_shape00_91_38,tshirt_shape00_91_61,tshirt_shape00_91_62
        summary: ${GA_VTO_TSHIRT_SUMMARY:-~/research/GA/hood/rebuttal_partmm_tshirt_shape00_91_33/data/precomputed_tshirt/summary.json}
      - id: dress
        exclude: ""
        training_cases: dress_shape00_01_01,dress_shape00_02_04,dress_shape00_02_05,dress_shape00_05_20,dress_shape00_07_02
        expected_cases: dress_shape00_91_38,dress_shape00_91_61,dress_shape00_91_62
        summary: ${GA_VTO_DRESS_SUMMARY:-~/research/GA/hood/output/precomputed_dress/summary.json}
methods:
  - id: robust_lbs
    label: Robust LBS
    mode: external
    stages:
      - id: evaluate
        type: command
        cwd: ${GAUSSIANIMATE_ROOT:-~/research/code/GaussiAnimate}
        command:
          - ${GA_HOOD_PYTHON:-~/anaconda3/envs/hood/bin/python}
          - -m
          - experiments.mesh.vto_lbs
          - --garment
          - "{case.id}"
          - --output
          - "{run_dir}/geometry_metrics.json"
          - --vto-root
          - ${GA_VTO_ROOT:-~/research/data/vto-dataset}
          - --smpl-model-path
          - ${GA_SMPL_MODEL_DIR:-~/research/lib/SMPL_python_v.1.1.0/smpl/models}
          - --test-start
          - 50
          - --exclude
          - "{case.exclude}"
          - --expected-cases
          - "{case.expected_cases}"
          - --result-dir
          - "{run_dir}/lbs_arrays"
        inputs:
          - "${GA_VTO_ROOT:-~/research/data/vto-dataset}/{case.id}/simulations"
          - ${GA_SMPL_MODEL_DIR:-~/research/lib/SMPL_python_v.1.1.0/smpl/models}
        outputs:
          - "{run_dir}/geometry_metrics.json"
          - "{run_dir}/lbs_arrays/transferred_weights.npz"
  - id: mlp
    label: Ours + MLP (8 layers, hidden 512)
    mode: external
    stages:
      - &vto_suite
        id: evaluate
        type: command
        resources: {gpu: true}
        cwd: ${GAUSSIANIMATE_ROOT:-~/research/code/GaussiAnimate}
        command:
          - ${GA_HOOD_PYTHON:-~/anaconda3/envs/hood/bin/python}
          - -m
          - experiments.mesh.vto_suite
          - --garment
          - "{case.id}"
          - --method
          - "{method.id}"
          - --output
          - "{run_dir}/geometry_metrics.json"
          - --summary
          - "{case.summary}"
          - --expected-cases
          - "{case.expected_cases}"
          - --hood-root
          - ${GA_HOOD_ROOT:-~/research/GA/hood}
          - --python
          - ${GA_HOOD_PYTHON:-~/anaconda3/envs/hood/bin/python}
          - --n-train
          - 5
          - --exclude
          - "{case.exclude}"
        inputs:
          - "${GA_VTO_ROOT:-~/research/data/vto-dataset}/{case.id}/simulations"
        outputs: ["{run_dir}/geometry_metrics.json"]
  - id: gru
    label: Ours + GRU (hidden 512)
    mode: external
    stages:
      - *vto_suite
  - id: fullmm
    label: FullMM
    mode: external
    stages:
      - *vto_suite
  - id: partmm
    label: PartMM
    mode: external
    stages:
      - *vto_suite
