name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core
        run: python -m pip install '.[dev]'
      - name: Run dependency-light tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          python -m pytest -q
          tests/test_skelebone_core.py tests/test_skelebone_extraction.py
          tests/test_partmm.py tests/test_partmm_modules.py
          tests/test_partmm_fallback.py tests/test_skelebone_examples.py
          tests/test_experiment_config.py
      - name: Validate experiment presets
        run: |
          python -m experiments.run experiments/monocular_gaussian/config.yaml --validate-only
          python -m experiments.run experiments/multiview_gaussian/config.yaml --validate-only
          python -m experiments.run experiments/mesh/config.yaml --validate-only

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build source distribution and wheel
        run: |
          python -m pip install 'build>=1,<2' 'setuptools>=70.1' wheel
          python -m build
      - name: Audit wheel boundary
        run: python tests/check_wheel.py dist/*.whl
      - name: Smoke test installed entry points outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "from importlib.metadata import distribution; assert all(callable(e.load()) for e in distribution('gaussianimate').entry_points if e.group == 'console_scripts')"

  native:
    runs-on: ubuntu-22.04
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      GAUSSIANIMATE_TEST_NATIVE: "1"
      GAUSSIANIMATE_TEST_NATIVE_PYSSDR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcgal-dev libeigen3-dev
          python -m pip install '.[dev,ssdr]'
      - name: Build SSDR and test both native backends
        run: |
          bash scripts/install_geometry.sh --pyssdr-only --no-python-deps
          python -m pytest tests/test_native_pyssdr.py tests/test_native_geometry.py -q

  research:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU experiment dependencies
        run: |
          python -m pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev,geometry,visualization,evaluation,research]'
      - name: Run full test suite
        run: python -m pytest tests -q

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install GUI extra
        run: python -m pip install '.[gui]'
      - name: Exercise editor without a display server
        run: python tests/smoke_gui.py
